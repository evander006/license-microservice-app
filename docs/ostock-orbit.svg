<svg xmlns="http://www.w3.org/2000/svg" width="920" height="220" viewBox="0 0 920 220" role="img" aria-label="Ostock services orbit">
  <defs>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7c5cff"/>
      <stop offset="100%" stop-color="#3ee0b0"/>
    </linearGradient>
    <filter id="soft">
      <feGaussianBlur stdDeviation="2.2" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="920" height="220" rx="18" fill="#0b1020"/>
  <text x="36" y="48" fill="#c9d4ff" font-family="ui-monospace, Consolas, monospace" font-size="22">ostock // live mesh</text>
  <text x="36" y="74" fill="#6f7aa8" font-family="ui-monospace, Consolas, monospace" font-size="13">licenses talk to orgs without knowing the street address</text>

  <ellipse cx="620" cy="118" rx="210" ry="62" fill="none" stroke="#243056" stroke-width="1.5"/>
  <ellipse cx="620" cy="118" rx="140" ry="38" fill="none" stroke="#1b2544" stroke-dasharray="6 8">
    <animate attributeName="stroke-dashoffset" from="0" to="28" dur="4s" repeatCount="indefinite"/>
  </ellipse>

  <circle cx="620" cy="118" r="10" fill="url(#glow)" filter="url(#soft)">
    <animate attributeName="r" values="8;12;8" dur="2.4s" repeatCount="indefinite"/>
  </circle>
  <text x="636" y="123" fill="#9fb3ff" font-family="ui-monospace, Consolas, monospace" font-size="12">eureka</text>

  <g>
    <animateTransform attributeName="transform" type="rotate" from="0 620 118" to="360 620 118" dur="12s" repeatCount="indefinite"/>
    <circle cx="830" cy="118" r="7" fill="#3ee0b0"/>
    <text x="840" y="122" fill="#9ff5d8" font-family="ui-monospace, Consolas, monospace" font-size="11">license:8080</text>
  </g>
  <g>
    <animateTransform attributeName="transform" type="rotate" from="180 620 118" to="540 620 118" dur="12s" repeatCount="indefinite"/>
    <circle cx="830" cy="118" r="7" fill="#ffb86b"/>
    <text x="840" y="122" fill="#ffd7a8" font-family="ui-monospace, Consolas, monospace" font-size="11">org:8081</text>
  </g>

  <text x="36" y="150" fill="#3ee0b0" font-family="ui-monospace, Consolas, monospace" font-size="12">
    <tspan>$ </tspan>
    <tspan>
      docker compose up
      <animate attributeName="opacity" values="1;0;1" dur="1.2s" repeatCount="indefinite"/>
    </tspan>
  </text>
  <text x="36" y="176" fill="#6f7aa8" font-family="ui-monospace, Consolas, monospace" font-size="12">config :8071   ·   eureka :8070   ·   postgres :5432</text>
</svg>
